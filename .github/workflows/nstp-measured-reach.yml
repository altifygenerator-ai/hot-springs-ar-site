name: Measured reach quality checks
on:
  push:
    branches: [feature/nstp-measured-reach]
  pull_request:
    paths:
      - "**/NstpReachTracker.tsx"
      - "**/layout.tsx"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-not-production"
          OPENAI_API_KEY: "sk-ci-placeholder-not-production"
